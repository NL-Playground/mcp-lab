services:
  postgres:
    image: postgres:18.4
    container_name: postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-user_management_demo}"
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
      # Postgres 首次啟動會自動依檔名順序執行此目錄下的 *.sql
      - ./demo-db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-user_management_demo}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pg-data:
